---
# Démarrer le reverse proxy Apache
- name: Launch Apache HTTPD proxy
  community.docker.docker_container:
    name: httpd
    image: ussi77/tp-devops-httpd:latest
    state: started
    pull: always
    restart_policy: unless-stopped
    networks:
      - name: app-network
    published_ports:
      - "80:80"