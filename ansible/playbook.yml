---
# Déploiement de l'application sur le serveur Takima
- hosts: all
  gather_facts: true # Récupérer les informations du serveur distant
  become: true # Exécuter les tâches nécessitant les droits administrateur
  # Interpréteur Python contenant le SDK Docker installé précédemment dans notre environnement virtuel.
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    postgres_user: "{{ vault_postgres_user }}"
    postgres_password: "{{ vault_postgres_password }}"
    postgres_db: "{{ vault_postgres_db }}"
  roles:
    - docker # Installer et démarrer Docker
    - network # Créer le réseau partagé par les conteneurs
    - database # Déployer la base de données PostgreSQL
    - app # Déployer l'application Spring Boot
    - front
    - proxy # Déployer le serveur Apache en tant que reverse proxy
