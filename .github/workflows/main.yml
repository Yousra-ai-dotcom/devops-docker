name: CI devops 2025

# "on" définit les événements qui déclenchent la CI
on:
  # Déclencher automatiquement la CI quand on envoie du code sur GitHub
  push:
    # Sur quelles branches le workflow doit se lancer ?
    branches:
      - master   # Notre branche principale
      - develop  # Branche utilisée pour le développement

  # Lancer également la CI lorsqu'une Pull Request est créée ou mise à jour
  # Une Pull Request sert à proposer des modifications avant de les fusionner
  pull_request:

# "jobs" contient les tâches à exécuter automatiquement
jobs:
  # Nom technique de notre tâche : tester le backend
  test-backend:

    # GitHub fournit une machine virtuelle Ubuntu 24.04 pour exécuter la tâche
    # On n'utilise donc pas directement notre Mac
    runs-on: ubuntu-24.04

    # "steps" définit les étapes exécutées dans l'ordre
    steps:

      # Étape 1 : télécharger le code du dépôt GitHub sur la machine Ubuntu
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : installer Java pour pouvoir compiler notre application Spring Boot
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Temurin est une distribution du JDK (Java Development Kit)
          distribution: 'temurin'

          # Notre projet utilise Java 21
          java-version: '21'

      # Étape 3 : compiler et tester automatiquement notre backend avec Maven
      - name: Build and test with Maven

        # mvn : lance Maven
        # clean : supprime les fichiers générés lors des compilations précédentes
        # verify : compile et exécute les tests, puis vérifie le build
        # --file : indique où se trouve le fichier pom.xml du backend
        # Testcontainers démarre temporairement PostgreSQL pour les tests d'intégration
        run: mvn clean verify --file backend/simpleapi/pom.xml
        # Analyser la qualité et la sécurité du code avec SonarQube Cloud
      - name: Analyze code with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=yousra-ai-dotcom_devops-docker
          -Dsonar.organization=yousra-ai-dotcom
          -Dsonar.host.url=https://sonarcloud.io
          --file backend/simpleapi/pom.xml

  # Deuxième job : construire les 3 images Docker
  build-and-push-docker-image:

    # Attendre que les tests du backend réussissent
    needs: test-backend

    # Utiliser une machine Ubuntu
    runs-on: ubuntu-24.04

    steps:
      # Récupérer le code depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Se connecter à Docker Hub pour pouvoir publier nos images
      # Les identifiants sont stockés dans les secrets GitHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Construire l'image Docker du backend
      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/simpleapi
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/master' }}

      # Construire l'image Docker de la base PostgreSQL
      - name: Build image database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/master' }}

      # Construire l'image Docker du serveur Apache HTTP
      - name: Build image httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/master' }}