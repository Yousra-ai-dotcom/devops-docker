name: Build and Push Docker Images

# Démarrer après la fin du workflow Test Backend
on:
  workflow_run:
    workflows:
      - Test Backend
    types:
      - completed
    branches:
      - master

jobs:
  build-and-push-docker-image:
    # Publier uniquement si les tests ont réussi
    # et si le workflow a été déclenché par un push sur master
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' }}

    runs-on: ubuntu-24.04

    steps:
      # Récupérer exactement le commit qui a réussi les tests
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Se connecter à Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire et publier le backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      # Construire et publier PostgreSQL
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      # Construire et publier le frontend Vue.js
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./devops-front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest

      # Construire et publier Apache
      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest

    # Déployer automatiquement après la publication des images Docker
  deploy:
    name: Deploy application with Ansible
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04

    steps:
      # Récupérer le commit qui a passé les tests CI
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Préparer la clé privée pour la connexion SSH au serveur
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TAKIMA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TAKIMA_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa_takima
          chmod 600 ~/.ssh/id_rsa_takima

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        
      # Déployer avec Ansible exécuté dans Docker et Vault
      - name: Deploy with Dockerized Ansible and Vault
        env:
          ANSIBLE_HOST: ${{ secrets.ANSIBLE_HOST }}
          ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          docker build -t tp-devops-ansible ./ansible/runner

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"

          docker run --rm \
            -v "$PWD/ansible:/workspace/ansible:ro" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -v "$RUNNER_TEMP/vault-pass:/run/secrets/vault-pass:ro" \
            -e ANSIBLE_HOST \
            -e ANSIBLE_USER \
            -e DOCKERHUB_USERNAME \
            -e TAKIMA_SSH_KEY_PATH=/root/.ssh/id_rsa_takima \
            tp-devops-ansible \
            ansible-playbook \
              -i ansible/inventories/setup.yml \
              ansible/playbook.yml \
              --vault-password-file /run/secrets/vault-pass

          rm -f "$RUNNER_TEMP/vault-pass"