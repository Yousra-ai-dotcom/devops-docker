name: Test Backend

# Exécuter les tests sur master et develop
on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Compiler et exécuter les tests, y compris Testcontainers
      - name: Build and test with Maven
        run: mvn clean verify --file backend/simpleapi/pom.xml

      # Analyser le code avec SonarQube Cloud
      - name: Analyze code with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=yousra-ai-dotcom_devops-docker
          -Dsonar.organization=yousra-ai-dotcom
          -Dsonar.host.url=https://sonarcloud.io
          --file backend/simpleapi/pom.xml